name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Submissions store local time, alerts UTC: run in more than one zone.
        tz: ["UTC", "Europe/Berlin"]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r webui/requirements.txt -r mcp/requirements.txt -r requirements-dev.txt
      - name: Syntax check frontend
        run: node --check webui/static/js/app.js
      - name: Unit tests
        run: python -m pytest -v
